# docker-compose.yml — UseWorldview Backend
# Usage:
#   docker compose up --build        (start API + worker in unified mode)
#   docker compose up --build -d     (start in background)
#   docker compose logs -f           (follow logs)
#   docker compose down              (stop everything)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - ENV=production
      - RUN_MODE=unified
      - PLAYWRIGHT_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
